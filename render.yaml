services:
  - type: web
    name: syncscript-signaling
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build --workspace signaling
    startCommand: npm run start:prod --workspace signaling
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 4444
      - key: METRICS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info
