replicaCount: 2

image:
  repository: ghcr.io/OWNER/REPO/syncscript-signaling
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 4444

ingress:
  enabled: true
  className: nginx
  host: syncscript.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

redis:
  url: redis://syncscript-redis:6379

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

env:
  LOG_LEVEL: info
  METRICS_ENABLED: "true"
  ROOM_TTL_MS: "604800000"
  DEACTIVATION_MS: "120000"
