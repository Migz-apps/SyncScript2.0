<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncScript</title>
    <link rel="stylesheet" href="output.css">
    <style>
        #workspace-error-popup {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background-color: #ef4444; color: white; padding: 10px 20px; border-radius: 6px;
            font-size: 13px; font-weight: bold; z-index: 1000; display: flex; gap: 10px;
        }
        #workspace-error-popup.hidden { display: none; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1); border-left-color: #3b82f6;
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#1e1e1e] text-gray-200 p-4 font-sans text-sm select-none">

    <div id="deactivation-overlay" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50 p-6 text-center">
        <div class="bg-gray-900 border border-red-500 p-8 rounded-lg max-w-xs w-full">
            <h2 class="text-red-500 font-bold text-xl mb-2">Deactivating Room</h2>
            <div id="countdown-timer" class="text-5xl font-mono font-bold text-white mb-6">02:00</div>
            <button id="btn-stop-deactivation" class="hidden w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded font-bold">STOP DEACTIVATION</button>
        </div>
    </div>

    <div id="app" class="max-w-md mx-auto">
        <div class="flex items-center justify-between border-b border-gray-700 pb-2 mb-4">
            <h2 class="text-blue-400 font-bold text-lg">SyncScript</h2>
            <div class="flex items-center gap-2">
                <span id="latency-badge" class="text-[10px] text-gray-500"></span>
                <div id="status-dot" class="w-3 h-3 bg-red-500 rounded-full"></div>
            </div>
        </div>

        <div id="view-selection" class="space-y-3">
            <button id="nav-to-create" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Create Room</button>
            <button id="nav-to-join" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded">Join Room</button>
            <div id="history-section" class="hidden pt-2 border-t border-gray-700">
                <p class="text-[10px] text-gray-500 uppercase mb-2">Recent Rooms</p>
                <div id="history-list" class="space-y-1"></div>
            </div>
        </div>

        <div id="view-create" class="hidden space-y-3">
            <input type="text" id="create-name" placeholder="Room Name" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-white">
            <input type="password" id="create-key" placeholder="Room Password" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-white">
            <label class="flex items-center gap-2 text-xs text-gray-400">
                <input type="checkbox" id="create-approval"> Require join approval
            </label>
            <button id="btn-create" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Initialize</button>
            <button class="nav-back w-full text-gray-500 text-xs">← Back</button>
        </div>

        <div id="view-join" class="hidden space-y-3">
            <input type="text" id="join-id" placeholder="Room ID" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-white">
            <input type="text" id="join-name" placeholder="Your Name" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-white">
            <input type="password" id="join-key" placeholder="Password" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-white">
            <button id="btn-join" class="w-full bg-green-600 text-white py-2 rounded font-bold">Connect</button>
            <button class="nav-back w-full text-gray-500 text-xs">← Back</button>
        </div>

        <div id="view-active" class="hidden space-y-3">
            <div class="bg-gray-900 border border-gray-700 p-3 rounded">
                <p id="display-room-name" class="text-blue-400 font-bold text-sm">---</p>
                <p id="active-room-id" class="text-blue-500 font-mono text-sm break-all">---</p>
                <p id="role-badge" class="text-[10px] text-gray-500 uppercase mt-1"></p>
                <div class="flex gap-2 mt-2">
                    <button id="btn-copy-room-id" class="text-[10px] bg-gray-800 px-2 py-1 rounded border border-gray-600">Copy ID</button>
                    <button id="btn-copy-invite" class="text-[10px] bg-indigo-800 px-2 py-1 rounded border border-indigo-600">Copy Invite Link</button>
                </div>
            </div>

            <div id="pending-joins" class="hidden space-y-1">
                <p class="text-[10px] text-yellow-500 uppercase">Pending Approvals</p>
                <div id="pending-list"></div>
            </div>

            <button id="btn-sync-check" class="w-full py-2 bg-indigo-600 text-white rounded text-xs font-bold">Check Folder Sync</button>
            <div id="arch-sync-tree" class="hidden mt-2 pt-2 border-t border-gray-700 font-mono text-[11px]"></div>

            <div id="diagnostics-panel" class="hidden text-[10px] text-gray-400 border-t border-gray-700 pt-2">
                <p class="uppercase text-gray-500 mb-1">Peer Diagnostics</p>
                <div id="diagnostics-list"></div>
            </div>

            <div>
                <p class="text-[10px] text-gray-500 uppercase">Participants</p>
                <div id="member-list" class="space-y-1 mt-1 text-xs text-gray-300"></div>
            </div>

            <div class="pt-2 space-y-2">
                <button id="btn-leave" class="w-full bg-gray-800 text-gray-400 py-2 rounded border border-gray-700">Leave Room</button>
                <button id="btn-deactivate" class="hidden w-full border border-red-500/50 text-red-500 py-2 rounded font-bold">Deactivate Room</button>
            </div>

            <div id="chat-section" class="hidden pt-3 border-t border-gray-700">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Room Chat</p>
                <div id="chat-messages" class="max-h-32 overflow-y-auto text-xs space-y-1 mb-2"></div>
                <div class="flex gap-1">
                    <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-gray-800 border border-gray-700 p-1.5 rounded text-white text-xs">
                    <button id="btn-send-chat" class="bg-blue-600 px-2 py-1 rounded text-xs">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="workspace-error-popup" class="hidden"><span>⚠️</span><span>Open a folder first</span></div>

    <script src="treeView.js"></script>
    <script src="main.js"></script>
</body>
</html>
